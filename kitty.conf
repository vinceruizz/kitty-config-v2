# BEGIN_KITTY_THEME
# Neowave
include current-theme.conf
# END_KITTY_THEME
# # Typography
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto

font_size 13.0

# Enable ligatures
disable_ligatures never
# Left/right padding to avoid rounded corners
window_padding_width 8 18 12 18

# =================================================
# Midnight Glass - Kitty Tab Bar
# =================================================

# Tab bar at the top
tab_bar_edge top

# Always show the tab bar
tab_bar_min_tabs 1

# Minimal appearance
tab_bar_style powerline
tab_powerline_style round
tab_bar_align left

# Spacing around the tab bar (points)
tab_bar_margin_width 8
tab_bar_margin_height 5 7

# Background
tab_bar_background #0d1a2b
tab_bar_margin_color #070f1c

# Active tab
active_tab_foreground #86dbf5
active_tab_background #24394b
active_tab_font_style bold

# Inactive tabs
inactive_tab_foreground #9aafc2
inactive_tab_background #0d1a2b
inactive_tab_font_style normal

# Tab titles
tab_title_template " {index}: {title} "
active_tab_title_template " {index}: {title} "

# Limit tab width
tab_title_max_length 25

# Keyboard shortcuts
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab

