# Midnight Glass — kitty on macOS
# Colors live in current-theme.conf; behavior and layout live here.

# BEGIN_KITTY_THEME
# Midnight Glass
include current-theme.conf
# END_KITTY_THEME

# Typography
font_family JetBrainsMono Nerd Font
bold_font auto
italic_font auto
bold_italic_font auto
font_size 13.0
disable_ligatures never

# Glass appearance and room for macOS's rounded window corners.
# Pin the macOS window title independently of shell and tab titles.
startup_session startup.session
watcher fixed_window_title.py
macos_titlebar_color background
background_opacity 0.75
background_blur 30
# Order: top, right, bottom, left (points).
window_padding_width 8 24 12 24

# Top tab bar, including when only one tab is open.
tab_bar_edge top
tab_bar_min_tabs 1
tab_bar_style powerline
tab_powerline_style round
tab_bar_align left
tab_bar_margin_width 8
tab_bar_margin_height 5 7
active_tab_font_style bold
inactive_tab_font_style normal
tab_title_template " {index}: {title} "
active_tab_title_template " {index}: {title} "
tab_title_max_length 25

# Tab shortcuts
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map cmd+1 goto_tab 1
map cmd+2 goto_tab 2
map cmd+3 goto_tab 3
map cmd+4 goto_tab 4
map cmd+5 goto_tab 5
map cmd+6 goto_tab 6
map cmd+7 goto_tab 7
map cmd+8 goto_tab 8
map cmd+9 goto_tab 9
map cmd+` next_tab
map cmd+shift+` next_tab

# Explicit reload shortcut, in addition to kitty's macOS default.
map ctrl+shift+f5 load_config_file
# Apply the fixed title to an already-open OS window after reloading.
map ctrl+shift+f6 remote_control set-os-window-title Kitty Terminal

# vim:ft=kitty
